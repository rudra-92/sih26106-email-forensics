services:
  - type: web
    name: sandeshsetu-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python scripts/setup_geoip.py --skip-tor
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
