pe_analysis:
  suspicious_section_names:
    - ".upx0"
    - ".upx1"
    - ".upx2"
    - ".aspack"
    - ".adata"
    - ".mpress"
    - "pec1"
    - "pec2"
    - ".petite"
  suspicious_api_categories:
    process_creation:
      - "CreateProcessA"
      - "CreateProcessW"
      - "ShellExecuteA"
      - "ShellExecuteW"
      - "WinExec"
      - "CreateProcessWithTokenW"
    command_execution:
      - "system"
      - "popen"
      - "_wsystem"
      - "_popen"
    network_communication:
      - "InternetOpenA"
      - "InternetOpenW"
      - "InternetConnectA"
      - "HttpOpenRequestA"
      - "HttpSendRequestA"
      - "WSAStartup"
      - "socket"
      - "connect"
      - "send"
      - "recv"
      - "URLDownloadToFileA"
      - "URLDownloadToFileW"
    memory_manipulation:
      - "VirtualAlloc"
      - "VirtualAllocEx"
      - "VirtualProtect"
      - "VirtualProtectEx"
      - "WriteProcessMemory"
      - "ReadProcessMemory"
    persistence:
      - "RegSetValueExA"
      - "RegSetValueExW"
      - "RegCreateKeyExA"
      - "CreateServiceA"
      - "CreateServiceW"
    credential_access:
      - "CryptUnprotectData"
      - "LsaRetrievePrivateData"
      - "SamIConnect"
      - "CredReadA"
      - "CredReadW"

limits:
  max_file_size_bytes: 20971520   # 20 MB max attachment size for static analysis
  max_url_count: 200              # Cap URL inspection per email
  timeout_seconds: 10             # Per-sample parser timeout limit
